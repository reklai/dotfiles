// Load profile chrome/userChrome.js into each browser window.
// Do not import Services here. The resource protocol is not ready yet.
try {
	const { classes: Cc, interfaces: Ci, utils: Cu } = Components;
	const obs = Cc["@mozilla.org/observer-service;1"].getService(Ci.nsIObserverService);
	const loader = Cc["@mozilla.org/moz/jssubscript-loader;1"].getService(Ci.mozIJSSubScriptLoader);
	obs.addObserver({
		observe(subject) {
			try {
				const file = Cc["@mozilla.org/file/directory_service;1"]
					.getService(Ci.nsIProperties)
					.get("UChrm", Ci.nsIFile);
				file.append("userChrome.js");
				if (!file.exists()) {
					return;
				}
				// Firefox 156 rejects file: URLs here as untrusted, so map the
				// profile chrome folder to resource://userchrome/ and load from that.
				const io = Cc["@mozilla.org/network/io-service;1"].getService(Ci.nsIIOService);
				io.getProtocolHandler("resource")
					.QueryInterface(Ci.nsISubstitutingProtocolHandler)
					.setSubstitution("userchrome", io.newFileURI(file.parent));
				loader.loadSubScript("resource://userchrome/userChrome.js", subject);
			} catch (error) {
				Cu.reportError(error);
			}
		},
	}, "domwindowopened");
} catch (error) {
	Components.utils.reportError(error);
}
