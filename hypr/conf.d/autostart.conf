# Hand the session env to systemd and start the session units. Only
# compositor-coupled startup lives here; daemons are systemd user units.
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE && systemctl --user start hyprland-session.target
exec-once = ~/.config/waybar/scripts/wallpaper.sh restore
