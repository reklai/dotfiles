# Window-rule grammar (Hyprland 0.56+): effects are `name value`,
# matchers are prefixed `match:` — verified against the live parser.

# Steam has mixed normal and floating windows.
windowrule = float 1, match:class ([Ss]team)
windowrule = tile 1, match:class ([Ss]team), match:title ^(Steam)$
windowrule = float 1, match:class (steam), match:title (Steam Settings)

# Keep the audio mixer as a centered terminal-sized utility panel.
windowrule = float 1, match:class (.*[Pp]avucontrol)
windowrule = size 760 520, match:class (.*[Pp]avucontrol)
windowrule = center 1, match:class (.*[Pp]avucontrol)

# Selection overlays should not animate.
layerrule = no_anim 1, match:namespace selection
