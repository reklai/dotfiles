# Applications.
bind = SUPER, Z, exec, zen-browser
bind = SUPER SHIFT, Z, exec, flatpak run com.google.Chrome
bind = SUPER, G, exec, ghostty
bind = SUPER, I, exec, thunar
bind = SUPER, O, exec, ghostty -e btop

# Launchers and tools.
bind = SUPER, P, exec, fuzzel
bind = SUPER SHIFT, M, exec, ~/.config/wlogout/launch.sh
bind = SUPER SHIFT, P, exec, ~/.config/hypr/scripts/screenshot.sh
bind = SUPER SHIFT, R, exec, hyprctl reload

# Workspaces.
bind = SUPER, Q, workspace, 1
bind = SUPER, W, workspace, 2
bind = SUPER, E, workspace, 3
bind = SUPER, R, workspace, 4
# mango's `tag` moves the window without following it -> silent variant.
bind = SUPER, 1, movetoworkspacesilent, 1
bind = SUPER, 2, movetoworkspacesilent, 2
bind = SUPER, 3, movetoworkspacesilent, 3
bind = SUPER, 4, movetoworkspacesilent, 4

# Focus movement.
bind = SUPER, D, layoutmsg, rollnext
bind = SUPER, A, layoutmsg, rollprev
bind = SUPER, S, layoutmsg, cyclenext
bind = SUPER, H, movefocus, l
bind = SUPER, J, movefocus, d
bind = SUPER, K, movefocus, u
bind = SUPER, L, movefocus, r

# Master-stack layout.
bind = SUPER, minus, exec, wtype -M ctrl -k minus -m ctrl
bind = SUPER, equal, exec, wtype -M ctrl -k equal -m ctrl
bind = SUPER SHIFT, minus, layoutmsg, mfact -0.05
bind = SUPER SHIFT, equal, layoutmsg, mfact +0.05

# Window actions.
bind = SUPER, M, killactive
bind = SUPER, F, fullscreen, 1
