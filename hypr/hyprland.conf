# Hyprland 0.55+ loads hyprland.lua when it exists; this hyprlang tree is
# only used by an already-running hyprlang session (reload). Next login
# uses Lua. Do not delete this file mid-session: Hyprland will write a stub.
# Load order matters: later files can override earlier settings.
source = ~/.config/hypr/conf.d/env.conf
source = ~/.config/hypr/conf.d/input.conf
source = ~/.config/hypr/conf.d/layout.conf
source = ~/.config/hypr/conf.d/appearance.conf
source = ~/.config/hypr/conf.d/monitors.conf
source = ~/.config/hypr/conf.d/autostart.conf
source = ~/.config/hypr/conf.d/keybinds.conf
source = ~/.config/hypr/conf.d/mouse.conf
source = ~/.config/hypr/conf.d/rules.conf
