# GNOME settings, loaded by install.sh with `dconf load /`.
# Hand-filtered from `dconf dump /`: window sizes, app-grid layout and other
# machine state are left out.

[org/freedesktop/tracker/miner/files]
enable-monitors=false
index-recursive-directories=@as []

[org/gnome/desktop/a11y/interface]
reduced-motion='reduce'

[org/gnome/desktop/a11y/magnifier]
cross-hairs-length=58
mag-factor=7.0

[org/gnome/desktop/break-reminders/eyesight]
play-sound=true

[org/gnome/desktop/break-reminders/movement]
duration-seconds=uint32 300
interval-seconds=uint32 1800
play-sound=true

[org/gnome/desktop/interface]
accent-color='slate'
color-scheme='prefer-dark'
enable-animations=false
enable-hot-corners=false
overlay-scrolling=false
toolkit-accessibility=false

[org/gnome/desktop/notifications]
show-banners=false

[org/gnome/desktop/screen-time-limits]
daily-limit-seconds=uint32 28800

[org/gnome/desktop/search-providers]
disable-external=true
disabled=['org.gnome.Software.desktop', 'org.gnome.Calendar.desktop', 'org.gnome.Boxes.desktop', 'org.gnome.Calculator.desktop', 'org.gnome.Characters.desktop', 'org.gnome.clocks.desktop', 'org.gnome.Contacts.desktop', 'org.gnome.Weather.desktop']
sort-order=['org.gnome.Settings.desktop', 'org.gnome.Contacts.desktop', 'org.gnome.Nautilus.desktop']

[org/gnome/desktop/session]
idle-delay=uint32 0

# Super+Shift+1 through 4 switch workspaces. Super+1 through 4 stay free for Ghostty tabs.
[org/gnome/desktop/wm/keybindings]
activate-window-menu=@as []
begin-move=@as []
begin-resize=@as []
close=['<Super>m']
cycle-group=@as []
cycle-group-backward=@as []
cycle-panels=@as []
cycle-panels-backward=@as []
cycle-windows=@as []
cycle-windows-backward=@as []
maximize=@as []
maximize-horizontally=@as []
minimize=@as []
move-to-monitor-down=@as []
move-to-monitor-left=@as []
move-to-monitor-right=@as []
move-to-monitor-up=@as []
move-to-workspace-1=@as []
move-to-workspace-2=@as []
move-to-workspace-3=@as []
move-to-workspace-4=@as []
move-to-workspace-last=@as []
move-to-workspace-left=@as []
move-to-workspace-right=@as []
panel-run-dialog=@as []
switch-applications=@as []
switch-applications-backward=@as []
switch-group=@as []
switch-group-backward=@as []
switch-input-source=@as []
switch-input-source-backward=@as []
switch-panels=@as []
switch-panels-backward=@as []
switch-to-workspace-1=['<Shift><Super>1']
switch-to-workspace-2=['<Shift><Super>2']
switch-to-workspace-3=['<Shift><Super>3']
switch-to-workspace-4=['<Shift><Super>4']
switch-to-workspace-last=@as []
switch-to-workspace-left=@as []
switch-to-workspace-right=@as []
switch-windows=@as []
switch-windows-backward=@as []
toggle-fullscreen=@as []
toggle-maximized=['<Shift><Super>f']
unmaximize=@as []

[org/gnome/desktop/wm/preferences]
num-workspaces=1

[org/gnome/mutter]
dynamic-workspaces=false
edge-tiling=false
overlay-key=''

# Super+A and Super+S belong to Raise App, so tiling takes the Shift chords.
[org/gnome/mutter/keybindings]
toggle-tiled-left=['<Shift><Super>a']
toggle-tiled-right=['<Shift><Super>s']

[org/gnome/mutter/wayland/keybindings]
restore-shortcuts=@as []

[org/gnome/nautilus/preferences]
fts-enabled=false

[org/gnome/settings-daemon/plugins/media-keys]
custom-keybindings=@as []
help=@as []
logout=@as []
magnifier=@as []
magnifier-zoom-in=['<Super>equal']
magnifier-zoom-out=['<Super>minus']
screenreader=@as []
screensaver=@as []

[org/gnome/shell]
disable-user-extensions=false
disabled-extensions=['background-logo@fedorahosted.org']
enabled-extensions=['raise-app@local']
favorite-apps=['org.gnome.Nautilus.desktop', 'org.gnome.Ptyxis.desktop', 'org.mozilla.firefox.desktop']

[org/gnome/shell/keybindings]
focus-active-notification=@as []
screenshot=['<Super>p']
screenshot-window=@as []
show-screen-recording-ui=@as []
show-screenshot-ui=@as []
switch-to-application-1=@as []
switch-to-application-2=@as []
switch-to-application-3=@as []
switch-to-application-4=@as []
switch-to-application-5=@as []
switch-to-application-6=@as []
switch-to-application-7=@as []
switch-to-application-8=@as []
switch-to-application-9=@as []
toggle-application-view=@as []
toggle-message-tray=@as []
toggle-overview=['<Super>f']
toggle-quick-settings=@as []

[org/gnome/software]
download-updates=false
download-updates-notify=false
